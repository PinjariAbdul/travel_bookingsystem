{% extends 'base.html' %}
{% block title %}Profile - Travel Booking{% endblock %}
{% block content %}
<div style="max-width: 400px; margin: 3rem auto; background: white; padding: 2rem 3rem; border-radius: 16px; box-shadow: 0 14px 30px rgba(19, 91, 162, 0.2); animation: fadeSlideIn 0.8s ease forwards;">
  <h2 style="color: #135ba2; font-weight: 600; margin-bottom: 1.5rem; text-align: center;">Update Profile</h2>
  <form method="post">
    {% csrf_token %}
    <label for="id_first_name" style="color:chocolate ">First Name</label>
    <input type="text" id="id_first_name" name="first_name" value="{{ user.first_name }}" required style="width: 100%; padding: 10px; margin-bottom: 1rem; border: 2px solid #a3c0f1; border-radius: 10px;">

    <label for="id_last_name" style="color:chocolate ">Last Name</label>
    <input type="text" id="id_last_name" name="last_name" value="{{ user.last_name }}" required style="width: 100%; padding: 10px; margin-bottom: 1rem; border: 2px solid #a3c0f1; border-radius: 10px;">

    <label for="id_email" style="color:chocolate ">Email</label>
    <input type="email" id="id_email" name="email" value="{{ user.email }}" required style="width: 100%; padding: 10px; margin-bottom: 1.5rem; border: 2px solid #a3c0f1; border-radius: 10px;">

    <button type="submit" style="width: 100%; padding: 12px; background: #135ba2; color: white; border-radius: 14px; font-weight: 600; cursor: pointer; transition: background-color 0.3s;">Save</button>
  </form>
</div>
{% endblock %}
