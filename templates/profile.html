{% extends 'base.html' %}
{% block title %}Profile - Travel Booking{% endblock %}
{% block content %}
{%load static%}
<link rel="stylesheet" href="{% static 'CSS/profile.css' %}">
<div class="profile-container">
  <button id="editBtn" class="edit-button" type="button" aria-label="Edit Profile">Edit</button>

  <h2>Update Profile</h2>


  <form id="profileForm" method="post" novalidate>
    {% csrf_token %}
    <label for="id_first_name">First Name</label>
    <input type="text" id="id_first_name" name="first_name" value="{{ form.first_name.value }}" required>

    <label for="id_last_name">Last Name</label>
    <input type="text" id="id_last_name" name="last_name" value="{{ form.last_name.value }}" required>

    <label for="id_email">Email</label>
    <input type="email" id="id_email" name="email" value="{{ user.email }}" required>

    <button id="saveBtn" type="submit" class="save-button">Save</button>
  </form>
</div>

{% if messages %}
  {% for message in messages %}
    <div id="successPopup" class="success-popup visible" role="alert" aria-live="assertive">
      {{ message }}
    </div>
  {% endfor %}
{% endif %}

<script>
  document.addEventListener('DOMContentLoaded', function () {
    const form = document.getElementById('profileForm');
    const editBtn = document.getElementById('editBtn');
    const saveBtn = document.getElementById('saveBtn');
    const successPopup = document.getElementById('successPopup');

    // Set initial state: make inputs readonly and show Edit button
    Array.from(form.elements).forEach(el => {
      if (el.tagName.toLowerCase() === 'input') {
        el.readOnly = true;
        el.classList.add('readonly');
      }
    });
    saveBtn.style.display = 'none';
    editBtn.style.display = 'inline-block';


    
    // Auto-hide success popup after 3 seconds
    if (successPopup) {
      setTimeout(() => {
        successPopup.classList.remove('visible');
      }, 3000);
    }

    // Edit button click handler
    editBtn.addEventListener('click', function () {
      Array.from(form.elements).forEach(el => {
        if (el.tagName.toLowerCase() === 'input') {
          el.readOnly = false;
          el.classList.remove('readonly');
        }
      });
      saveBtn.style.display = 'block';
      editBtn.style.display = 'none';
      form.querySelector('input').focus();
    });
  });
</script>


{% endblock %}
