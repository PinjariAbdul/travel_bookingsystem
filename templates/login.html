{% block content %}
<style>
  body {
    margin: 0;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    background: linear-gradient(135deg, #6627aaff, #2575fc);
    background-size: 400% 400%;
    animation: gradientAnimation 15s ease infinite;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  }

  @keyframes gradientAnimation {
    0% {
      background-position: 0% 50%;
    }
    50% {
      background-position: 100% 50%;
    }
    100% {
      background-position: 0% 50%;
    }
  }

  .login-container {
    background: rgba(255, 255, 255, 0.15);
    padding: 2.5rem 3rem;
    border-radius: 18px;
    box-shadow: 0 10px 30px rgba(0, 130, 200, 0.2);
    text-align: center;
    backdrop-filter: blur(15px);
    -webkit-backdrop-filter: blur(15px);
    border: 1px solid rgba(255, 255, 255, 0.3);
    max-width: 360px;
    width: 90vw;
  }

  h2 {
    color: #010509ff;
    font-weight: 700;
    margin-bottom: 1.8rem;
    text-align: center;
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }

  label {
    font-weight: 600;
    display: block;
    margin-bottom: 0.5rem;
    color: #000000ff;
    text-align: left;
  }

  input[type="text"],
  input[type="password"] {
    width: 100%;
    padding: 12px 14px;
    margin-bottom: 1.5rem;
    border-radius: 12px;
    border: 2px solid #66a6ff;
    outline: none;
    font-size: 1rem;
    transition: border-color 0.3s ease;
  }

  input[type="text"]:focus,
  input[type="password"]:focus {
    border-color: #2575fc;
  }

  button[type="submit"] {
    width: 100%;
    background-color: #2575fc;
    color: white;
    font-weight: 700;
    padding: 14px;
    border: none;
    border-radius: 16px;
    cursor: pointer;
    font-size: 1.1rem;
    transition: background-color 0.3s ease;
  }

  button[type="submit"]:hover {
    background-color: #6a11cb;
  }

  .error-message {
    color: #e2430dff;
    font-weight: 600;
    margin-bottom: 1rem;
    background-color: aliceblue;
  }

  p.signup-prompt {
    margin-top: 1.5rem;
    text-align: center;
    font-size: 0.9rem;
    color: #000000ff;
    font-size: larger;
    
  }

  p.signup-prompt a {
    color: #c1750aff;
    text-decoration: none;
    font-weight: 500;
    font-size: larger;
    
  }
  p.signup-prompt a:hover {
    text-decoration: underline;
  }
</style>

<div class="login-container">
  <h2>Log In</h2>

  <form method="post" novalidate>
    {% csrf_token %}

    {% if form.errors %}
      <div class="error-message" role="alert">
        {% if form.non_field_errors %}
          <p>{{ form.non_field_errors|join:", " }}</p>
        {% else %}
          <p>Invalid username or password.</p>
        {% endif %}
      </div>
    {% endif %}

    <label for="id_username">Username</label>
    <input id="id_username" name="username" type="text" required autofocus
           value="{{ form.username.value|default_if_none:'' }}">

    <label for="id_password">Password</label>
    <input id="id_password" name="password" type="password" required>

    <button type="submit">Log In</button>
  </form>

  <p class="signup-prompt">
    New here? <a href="{% url 'register' %}">Create an account</a>
  </p>


</div>
{% endblock %}
