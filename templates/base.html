{% load  static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}Travel Booking App{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'CSS/base.css' %}">
</head>
<body>
  <header>
    <h1>Travel Booking</h1>
    <nav>
      <a href="{% url 'home' %}" {% if request.path == '/' %}class="active"{% endif %}>Explore</a>
      {% if user.is_authenticated %}
        <a href="{% url 'my_bookings' %}" {% if 'my-bookings' in request.path %}class="active"{% endif %}>My Bookings</a>
        <a href="{% url 'profile' %}" {% if 'profile' in request.path %}class="active"{% endif %}>Profile</a>
        <form method="post" action="{% url 'logout' %}" class="logout-form">
          {% csrf_token %}
          <button type="submit">Logout</button>
        </form>
      {% else %}
        <a href="{% url 'register' %}">Register</a>
        <a href="{% url 'login' %}">Login</a>
      {% endif %}
    </nav>
    <!-- Theme switcher can be added here if needed -->
  </header>

  <main>
    {% block content %}{% endblock %}
  </main>

  <footer>
    &copy; 2025 Travel Booking
  </footer>
</body>
</html>
